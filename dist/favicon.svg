<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Depth Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#f8fafc"/>
      <feStop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#10b981"/>
      <feStop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="needle-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#475569"/>
      <feStop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square with Crisp Dark Charcoal Border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg-grad)" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Compass / Globe Inner Dial Ring with Strong Border -->
  <circle cx="32" cy="32" r="19" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>

  <!-- Black Dotted Latitude & Longitude lines -->
  <ellipse cx="32" cy="32" rx="19" ry="8" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="32" y1="13" x2="32" y2="51" stroke="#000000" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="13" y1="32" x2="51" y2="32" stroke="#000000" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="32" y1="13" x2="32" y2="16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="51" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="32" x2="16" y2="32" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="51" y2="32" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass Needle (North: Emerald, South: Dark Slate) -->
  <polygon points="32,16 37,32 32,28 27,32" fill="url(#needle-grad)" stroke="#0f172a" stroke-width="0.8"/>
  <polygon points="32,48 37,32 32,36 27,32" fill="url(#needle-dark)" stroke="#0f172a" stroke-width="0.8"/>

  <!-- Compass Center Pivot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
</svg>